<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>WiFi sign-in</title>
<style>
  :root { --bg:#f3f5f8; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#dfe3e8; --accent:#2563eb; --danger:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --text:#e6e8eb; --muted:#9aa2ad; --line:#2d333c; --accent:#5b8def; --danger:#ef6461; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; } p { margin:0 0 16px; color:var(--muted); }
  .tabs { display:flex; gap:4px; margin:0 0 16px; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:8px; font:inherit; color:var(--muted); cursor:pointer; }
  .tabs button.on { color:var(--text); border-color:var(--accent); font-weight:600; }
  form { display:grid; gap:10px; } form[hidden] { display:none; }
  input { font:inherit; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); width:100%; }
  input.code { text-transform:uppercase; letter-spacing:3px; text-align:center; }
  .btn { font:inherit; padding:11px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; width:100%; text-decoration:none; display:block; text-align:center; }
  .btn.secondary { background:none; border:1px solid var(--line); color:var(--text); }
  .error { color:var(--danger); border:1px solid var(--danger); border-radius:8px; padding:9px 12px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; margin-bottom:16px; } td { padding:6px 0; border-bottom:1px solid var(--line); } td:last-child { text-align:right; }
</style>
</head>
<body>
<div class="card">
  <h1>Welcome to our WiFi</h1>
  <p>Sign in with your ERP account, or use a guest voucher.</p>
  $(if error)<div class="error">$(error)</div>$(endif)
  <div class="tabs">
    <button type="button" id="tab-erp" class="on" onclick="show('erp')">Staff (ERP)</button>
    <button type="button" id="tab-voucher" onclick="show('voucher')">Guest voucher</button>
  </div>
  <!-- PAP login: the hotspot profile must have login-by=http-pap (and https). -->
  <form id="form-erp" name="login" action="$(link-login-only)" method="post">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <input name="username" value="$(username)" placeholder="ERP email or username" autocomplete="username" autocapitalize="off" required>
    <input name="password" type="password" placeholder="ERP password" autocomplete="current-password" required>
    <button class="btn">Sign in</button>
  </form>
  <form id="form-voucher" action="$(link-login-only)" method="post" hidden onsubmit="this.password.value = this.username.value">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" name="password">
    <input name="username" class="code" placeholder="VOUCHER CODE" autocomplete="off" autocapitalize="characters" required>
    <button class="btn">Connect</button>
  </form>
</div>
<script>
  function show(which) {
    ["erp", "voucher"].forEach(function (k) {
      document.getElementById("form-" + k).hidden = k !== which;
      document.getElementById("tab-" + k).className = k === which ? "on" : "";
    });
    try { localStorage.setItem("wifi-tab", which); } catch (e) {}
  }
  try { if (localStorage.getItem("wifi-tab") === "voucher") show("voucher"); } catch (e) {}
</script>
</body>
</html>
