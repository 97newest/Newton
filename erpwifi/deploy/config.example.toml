# erpwifi configuration for core-01 ("0. Firewall", RB5009).
# Copy to config.toml, fill in every value marked CHANGE, and upload it to the
# router's erpwifi/data/ folder (Winbox > Files, drag and drop).

[site]
timezone = "Africa/Nairobi"   # "today" for daily allowances

[radius]
listen = "0.0.0.0"
auth_port = 1812
acct_port = 1813
interim_interval = 300
# Hotspot user profile on the router that signed-in users are placed in
# (created by routeros/core01-2-hotspot.rsc).
router_user_profile = "erpwifi"

# The router as seen from the container (its address on the container bridge).
[[radius.clients]]
address = "172.31.250.1"
secret = "CHANGE-same-as-radiusSecret-in-core01-2-hotspot.rsc"
name = "0. Firewall"
coa_port = 3799

[erpnext]
url = "https://CHANGE.example.com"
# ERPNext > User > API Access > Generate Keys, on a user that can read
# User and Employee (a dedicated "wifi-integration" user is best).
api_key = "CHANGE"
api_secret = "CHANGE"
timeout = 8
verify_tls = true
require_roles = ["Employee"]
# If ERPNext is unreachable, people who signed in with the same password in
# the last 12 hours can still get on. Set 0 to refuse everyone (fail closed).
offline_grace_hours = 12

[policy]
default_profile = "staff"

# Speed is left to the router's existing mangle/PCQ setup (10 Mbps per IP via
# Std-Pkt). A profile's address_list puts the signed-in device into one of the
# existing lists for a different tier: Express (full speed), Restrict-Conn
# (5M), Slow-Conn (512k). rate_limit would create a separate hotspot queue
# that bypasses that tree, so it is left empty here on purpose.
[profiles.staff]
session_timeout = 43200       # 12 h, then sign in again
idle_timeout = 1800
max_devices = 3

[profiles.management]
address_list = "Express"
max_devices = 5

[profiles.restricted]
address_list = "Restrict-Conn"
session_timeout = 28800
daily_data_mb = 2048
max_devices = 1

# Vouchers: internet only. core01-2-hotspot.rsc drops HS-GUEST -> internal networks.
[profiles.guest]
address_list = "HS-GUEST"
session_timeout = 14400
idle_timeout = 900
daily_data_mb = 1024
max_devices = 1

# First match wins; everyone else gets policy.default_profile.
[[rules]]
role = "System Manager"
profile = "management"

[[rules]]
department = "Management"
profile = "management"

[vouchers]
default_profile = "guest"
default_minutes = 1440
code_length = 8

[dashboard]
listen = "0.0.0.0"
port = 8080
admin_username = "admin"
# Generate with: docker run --rm -it ghcr.io/97newest/erpwifi erpwifi hash-password
admin_password_hash = ""
secret_key = "CHANGE-to-a-long-random-string"
# Who may open the dashboard (the router firewall also limits this to the
# WIFI-ADMINS address list).
allowed_networks = ["192.168.6.0/24", "192.168.80.0/24"]

[database]
path = "/data/erpwifi.db"
