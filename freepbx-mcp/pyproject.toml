[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freepbx-mcp"
version = "0.1.0"
description = "MCP server that lets Hermes Agent monitor FreePBX and place calls over AMI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
freepbx-mcp = "freepbx_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
